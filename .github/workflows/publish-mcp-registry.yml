name: Publish to MCP Registry

on:
  # Trigger after npm publish workflow completes successfully
  workflow_run:
    workflows: ["Publish to npm"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate only)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run if npm workflow succeeded (for workflow_run trigger)
    # or always run for manual dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download MCP Publisher CLI
        run: |
          curl -sSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz -o mcp-publisher.tar.gz
          tar xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate packages/mcp-server/server.json

      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: ./mcp-publisher publish packages/mcp-server/server.json
