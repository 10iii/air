name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate only)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MCP Publisher CLI
        run: npm install -g @anthropic-ai/mcp-publisher

      - name: Validate server.json
        run: mcp-publisher validate packages/mcp-server/server.json

      - name: Publish to MCP Registry
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        run: mcp-publisher publish packages/mcp-server/server.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
